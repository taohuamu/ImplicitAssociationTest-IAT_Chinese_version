# ============================================================================
# 内隐联想测验（IAT）中文版 · 实验配置
# ----------------------------------------------------------------------------
# 换实验内容只需要改这个文件，不用碰 run.py。
# 改完先跑：python run.py --check-only
# ============================================================================

experiment:
  name: IAT
  # 布局：nosek7 = Nosek(2007) 七区块（200 试次，主流）
  #       greenwald5 = Greenwald(1998) 五部分（140 试次，与蔡华俭 2003 描述一致）
  layout: nosek7
  # 中文字体。auto = 按操作系统自动挑选（Windows 用微软雅黑）
  # 也可以直接写字体名，例如 "SimHei"
  font: auto

window:
  size: [1366, 768]      # 非全屏时的窗口尺寸
  fullscreen: true
  background: black

keys:
  left: e
  right: i

timing:
  # 试次开始（类别标签出现）到刺激出现之间的间隔，秒。这一项即文献中的 ITI
  stim_delay: 0.3
  # 单个试次的作答时限，秒。0 = 不限时（IAT 标准做法：必须改正才能继续）
  rt_timeout: 0
  # 知情同意页的最短停留时间，秒。这段时间内按键无效，防止被试误触直接"同意"
  consent_min_time: 3.0
  # 每个区块说明页的最短停留时间，秒。防止连按导致说明页被瞬间跳过
  instruction_min_time: 1.5

# ----------------------------------------------------------------------------
# 答错时怎么处理
#   correct = 屏幕下方显示红 X，必须按对键才能继续（IAT 标准做法，
#             反应时记的是"改对之后"的时间）
#   advance = 不显示任何反馈，答错也直接进入下一试次
#             （计分时会给错误试次加 600ms 惩罚，见 score.py）
# default 是默认行为，下面按区块号单独覆盖；区块号见 check.cmd 的输出
# ----------------------------------------------------------------------------
error_handling:
  default: correct
  3: advance
  4: advance
  6: advance
  7: advance

# ----------------------------------------------------------------------------
# 计分参数。默认值 = Greenwald, Nosek & Banaji (2003) Table 4 的改进算法
# ----------------------------------------------------------------------------
scoring:
  rt_max: 10000          # 剔除慢于该值的试次（毫秒）
  fast_rt: 300           # 快于该值算"快速试次"
  fast_pct_limit: 0.10   # 快速试次比例超过 10% 就剔除该被试
  # 错误率剔除线。2003 的改进算法里没有这一条，默认关闭。
  # 想沿用 Greenwald(1998)/蔡华俭(2003) 的 20% 标准，就填 0.20
  error_rate_exclude: null
  # 是否删除快于 400ms 的试次。true 对应原文的 D2/D6 变体
  delete_below_400: false
  # advance 模式下，错误试次替换为「该区块正确均值 + 这个惩罚」
  error_penalty: 600

# ----------------------------------------------------------------------------
# 属性词：全程固定在屏幕某一侧，不参与左右互换
#   side 必须是 left 或 right，且两个属性必须分居两侧
# ----------------------------------------------------------------------------
attributes:
  - name: 积极
    side: right
    exemplars: [喜爱, 和平, 愉快, 快乐, 拥抱]
  - name: 消极
    side: left
    exemplars: [痛苦, 憎恨, 战争, 丑恶, 死亡]

# ----------------------------------------------------------------------------
# 概念词：side 表示"正顺序（T 组）"下它所在的侧；
# 反顺序（F 组）时左右自动互换——这是配对顺序平衡的实现方式。
#
# 相容配对 = 概念词与同侧属性词构成的配对。
# 例如 花 与 积极 同在 right，则"花-积极"为相容，另一侧"虫-消极"也为相容。
# 校验规则：两个概念必须分居两侧；每个概念的 side 必须与某个属性相同。
# ----------------------------------------------------------------------------
concepts:
  - name: 花
    side: right
    exemplars: [玫瑰, 百合, 兰花, 荷花, 菊花]
  - name: 虫
    side: left
    exemplars: [蚊子, 蟑螂, 苍蝇, 蚂蚁, 飞蛾]

# ----------------------------------------------------------------------------
# 指导语。{L} {R} 会被替换成当前区块左右两侧的类别名，
# {KEY_L} {KEY_R} 会被替换成实际的按键字母。保留这些占位符。
# ----------------------------------------------------------------------------
instructions:
  consent: |
    欢迎参加本次实验

    【研究目的】
    考察人们对不同类别词语的自动化联想，用于学术研究。

    【您需要做什么】
    这是一项词语分类的计算机任务。屏幕中央会逐个出现词语，
    请按屏幕上的提示把它们归到左侧或右侧。共 7 个部分，约需 5 分钟。
    请将双手食指分别放在 {KEY_L} 键和 {KEY_R} 键上，
    在不犯错的前提下尽可能快地反应。

    【可能的不适】
    本任务无已知风险。长时间注视屏幕可能略有疲劳，您可随时休息或退出。

    【自愿参与与退出】
    参加完全自愿。您可以在任何时候按 Esc 键退出，无需说明理由，
    不会对您造成任何不利影响，也不影响您应得的任何权益。

    【数据与隐私】
    数据以编号形式匿名保存，不记录姓名、学号等可识别身份的信息。
    仅用于本研究的统计分析，不对外公开，原始数据仅研究团队成员接触。
    保存期限 3 年，到期销毁。

    【联系方式】
    研究负责人：【请填写】    联系邮箱：【请填写】
    伦理审查批号：【如有请填写】

    如您已阅读以上内容并自愿参加，请按 空格 键继续；按 Esc 键退出。
  b1: |
    上方左侧是「{L}」，右侧是「{R}」。

    屏幕中央会逐个出现一个词语。请判断它属于左侧还是右侧的类别：
        属于左侧 {L} → 按 {KEY_L} 键
        属于右侧 {R} → 按 {KEY_R} 键

    每个词只属于一个类别。
    如果按错了，屏幕下方会出现一个红色 X，请按另一个键改正后继续。

    这是一个计时任务：请在保证准确的前提下尽快反应。
    反应过慢或错误过多都会使结果无法解释。

    准备好了请按 {KEY_L} 或 {KEY_R} 键开始。
  b2: |
    上方左侧是「{L}」，右侧是「{R}」。

    这次出现的是评价性的词语。请判断它属于左侧还是右侧：
        属于左侧 {L} → 按 {KEY_L} 键
        属于右侧 {R} → 按 {KEY_R} 键

    如果按错了，屏幕下方会出现一个红色 X，请按另一个键改正。

    请尽量快，同时尽量少出错。

    按 {KEY_L} 或 {KEY_R} 键开始。
  b3: |
    上面出现过的四类词语现在同时出现：
        左侧是「{L}」
        右侧是「{R}」

    请把每个词归入它所属的类别：
        按 {KEY_L} 键 归到左侧
        按 {KEY_R} 键 归到右侧

    绿色的标签是评价词，白色的标签是类别词，可以帮助您判断。
    如果按错，不必改正，屏幕会直接进入下一个词。

    按 {KEY_L} 或 {KEY_R} 键开始。
  b4: |
    继续刚才的任务。规则不变：
        左侧「{L}」→ {KEY_L} 键
        右侧「{R}」→ {KEY_R} 键

    请尽量快，同时尽量少出错。

    按 {KEY_L} 或 {KEY_R} 键开始。
  b5: |
    请注意：左右两侧的类别已经互换位置。
    原先在左侧的类别现在到了右侧，原先在右侧的到了左侧。

    现在：左侧是「{L}」，右侧是「{R}」。
    这一部分用来熟悉新的按键方式。

    按 {KEY_L} 或 {KEY_R} 键开始。
  b6: |
    四类词语再次同时出现，但位置与前面不同：
        左侧是「{L}」
        右侧是「{R}」

    请按新的位置归类；按错也不必改正，屏幕会直接进入下一个词。

    按 {KEY_L} 或 {KEY_R} 键开始。
  b7: |
    继续刚才的任务。规则不变：
        左侧「{L}」→ {KEY_L} 键
        右侧「{R}」→ {KEY_R} 键

    请尽量快，同时尽量少出错。

    按 {KEY_L} 或 {KEY_R} 键开始。
  thanks: |
    实验结束，感谢您的参与！

    请按任意键退出，并通知主试。
