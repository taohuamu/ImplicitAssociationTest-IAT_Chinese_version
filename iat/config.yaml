# ============================================================================
# 内隐联想测验（IAT）中文版 · 实验配置
# ----------------------------------------------------------------------------
# 换实验内容只需要改这个文件，不用碰 run.py。
# 改完先跑：python run.py --check-only
# ============================================================================

experiment:
  name: IAT
  # 布局：nosek7 = Nosek(2007) 七区块（200 试次，主流）
  #       greenwald5 = Greenwald(1998) 五部分（140 试次，与蔡华俭 2003 描述一致）
  layout: nosek7
  # 中文字体。auto = 按操作系统自动挑选（Windows 用微软雅黑）
  # 也可以直接写字体名，例如 "SimHei"
  font: auto

window:
  size: [1366, 768]      # 非全屏时的窗口尺寸
  fullscreen: true
  background: black

keys:
  left: e
  right: i

timing:
  # 试次开始（类别标签出现）到刺激出现之间的间隔，秒。这一项即文献中的 ITI
  stim_delay: 0.3
  # 单个试次的作答时限，秒。0 = 不限时（IAT 标准做法：必须改正才能继续）
  rt_timeout: 0
  # 知情同意页的最短停留时间，秒。这段时间内按键无效，防止被试误触直接"同意"
  consent_min_time: 3.0
  # 每个区块说明页的最短停留时间，秒。防止连按导致说明页被瞬间跳过
  instruction_min_time: 1.5

# ----------------------------------------------------------------------------
# 答错时怎么处理
#   correct = 屏幕下方显示红 X，必须按对键才能继续（IAT 标准做法，
#             反应时记的是"改对之后"的时间）
#   advance = 不显示任何反馈，答错也直接进入下一试次
#             （计分时会给错误试次加 600ms 惩罚，见 score.py）
# default 是默认行为，下面按区块号单独覆盖；区块号见 check.cmd 的输出
# ----------------------------------------------------------------------------
error_handling:
  default: correct
  3: advance
  4: advance
  6: advance
  7: advance

# ----------------------------------------------------------------------------
# 计分参数。默认值 = Greenwald, Nosek & Banaji (2003) Table 4 的改进算法
# ----------------------------------------------------------------------------
scoring:
  rt_max: 10000          # 剔除慢于该值的试次（毫秒）
  fast_rt: 300           # 快于该值算"快速试次"
  fast_pct_limit: 0.10   # 快速试次比例超过 10% 就剔除该被试
  # 错误率剔除线。2003 的改进算法里没有这一条，默认关闭。
  # 想沿用 Greenwald(1998)/蔡华俭(2003) 的 20% 标准，就填 0.20
  error_rate_exclude: null
  # 是否删除快于 400ms 的试次。true 对应原文的 D2/D6 变体
  delete_below_400: false
  # advance 模式下，错误试次替换为「该区块正确均值 + 这个惩罚」
  error_penalty: 600

# ----------------------------------------------------------------------------
# 属性词：全程固定在屏幕某一侧，不参与左右互换
#   side 必须是 left 或 right，且两个属性必须分居两侧
# ----------------------------------------------------------------------------
attributes:
  - name: 积极
    side: right
    exemplars: [喜爱, 和平, 愉快, 快乐, 拥抱]
  - name: 消极
    side: left
    exemplars: [痛苦, 憎恨, 战争, 丑恶, 死亡]

# ----------------------------------------------------------------------------
# 概念词：side 表示"正顺序（T 组）"下它所在的侧；
# 反顺序（F 组）时左右自动互换——这是配对顺序平衡的实现方式。
#
# 相容配对 = 概念词与同侧属性词构成的配对。
# 例如 花 与 积极 同在 right，则"花-积极"为相容，另一侧"虫-消极"也为相容。
# 校验规则：两个概念必须分居两侧；每个概念的 side 必须与某个属性相同。
# ----------------------------------------------------------------------------
concepts:
  - name: 花
    side: right
    exemplars: [玫瑰, 百合, 兰花, 荷花, 菊花]
  - name: 虫
    side: left
    exemplars: [蚊子, 蟑螂, 苍蝇, 蚂蚁, 飞蛾]

# ----------------------------------------------------------------------------
# 指导语。{L} {R} 会被替换成当前区块左右两侧的类别名，
# {KEY_L} {KEY_R} 会被替换成实际的按键字母。保留这些占位符。
# ----------------------------------------------------------------------------
instructions:
  consent: |
    欢迎参加这次实验

    这是一个词语分类的电脑任务，想了解大家对不同词语的联想。全程大约五分钟。

    开始以后，屏幕中间会一个一个出现词语。你按 {KEY_L} 或 {KEY_R}，把它归到屏幕左边或右边。具体怎么分，每一部分开始前都会说明。

    任务本身没有风险，也不会引起不适。只是盯几分钟屏幕，可能会有点累。

    参加完全自愿。中途不想做了，随时按 Esc 退出，不用说明理由，也不会有什么影响。

    数据只记编号，不记姓名学号这些能认出你的信息，只用于本研究的统计。原始数据只有研究组成员能看到，保存三年。

    有问题可以联系我们：
    研究负责人：【请填写】　邮箱：【请填写】
    伦理批号：【如有请填写】

    看完了、愿意参加，请按空格。不想参加就按 Esc。

  b1: |
    屏幕上方，左边是「{L}」，右边是「{R}」。

    下面会一个一个出现词语，你判断它属于哪一边：
    左边的按 {KEY_L}，右边的按 {KEY_R}。

    {ERROR_RULE}

    尽量快，但别为了快乱按。

    准备好了按 {KEY_L} 或 {KEY_R} 开始。

  b2: |
    上面左边是「{L}」，右边是「{R}」。

    这次出现的都是评价性的词。

    分法和刚才一样，左边的按 {KEY_L}，右边的按 {KEY_R}。

    {ERROR_RULE}

    按 {KEY_L} 或 {KEY_R} 开始。

  b3: |
    现在四类词混在一起出现。

    左边是「{L}」，右边是「{R}」。

    上面一行白的是一类，下面一行绿的是一类，看位置分就行。

    {ERROR_RULE}

    按 {KEY_L} 或 {KEY_R} 开始。

  b4: |
    分法和刚才一样，左边「{L}」，右边「{R}」。

    这部分长一些，保持速度。

    {ERROR_RULE}

    按 {KEY_L} 或 {KEY_R} 开始。

  b5: |
    注意，左右换了。

    现在左边是「{L}」，右边是「{R}」。按键跟着换：左边 {KEY_L}，右边 {KEY_R}。

    {ERROR_RULE}

    先适应一下，不用急。

    按 {KEY_L} 或 {KEY_R} 开始。

  b6: |
    四类词又一起出现了，位置也换了：

    左边「{L}」，右边「{R}」。

    {ERROR_RULE}

    按 {KEY_L} 或 {KEY_R} 开始。

  b7: |
    还是左边「{L}」，右边「{R}」。

    这是最后一部分，再坚持一下。

    {ERROR_RULE}

    按 {KEY_L} 或 {KEY_R} 开始。

  thanks: |
    做完了，谢谢！

    麻烦叫一下主试。
